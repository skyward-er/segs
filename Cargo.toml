[workspace.package]
authors = [
    "Federico Lolli <federico.lolli@skywarder.eu>",
    "Niccolò Betto <niccolo.betto@skywarder.eu>",
]
description = "Skyward Enhanced Ground Software"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace]
resolver = "3"
members = [
    "crates/segs-assets",
    "crates/segs",
    "crates/segs-ui",
    "crates/segs-plot",
    "crates/segs-memory",
    "crates/segs-mavlink",
]

[workspace.dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }
eframe = "0.36.2"
egui = { version = "0.36.2", default-features = false }
emath = { version = "0.36.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
