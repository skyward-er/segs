[workspace.package]
authors = [
    "Federico Lolli <federico.lolli@skywarder.eu>",
    "Niccolò Betto <niccolo.betto@skywarder.eu>",
]
description = "Skyward Enhanced Ground Software"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace]
resolver = "3"
members = [
    "crates/segs-assets",
    "crates/segs",
    "crates/segs-ui",
    "crates/segs-plot",
    "crates/segs-memory",
    "crates/segs-mavlink",
]

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
eframe = "0.34.1"
egui = { version = "0.34.1", default-features = false }
emath = { version = "0.34.1", default-features = false }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.24.0"
thiserror = "2.0.18"
